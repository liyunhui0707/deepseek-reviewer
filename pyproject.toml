[project]
name = "deepseek-reviewer"
version = "1.4.0"
description = "Independent DeepSeek code reviews from Codex, using restricted Claude Code on macOS"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "liyunhui0707"}]
dependencies = []

[project.urls]
Repository = "https://github.com/liyunhui0707/deepseek-reviewer"
Issues = "https://github.com/liyunhui0707/deepseek-reviewer/issues"

# Releases use the standard-library zipapp builder; no package manager is required.
[tool.deepseek-reviewer]
tested-claude = "2.1.312"
release-command = "python3 scripts/build.py"
test-command = "PYTHONPATH=src python3 -m unittest discover -s tests -v"
